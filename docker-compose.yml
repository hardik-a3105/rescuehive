version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: rescuehive-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rescuehive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rescuehive_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-rescuehive_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rescuehive} -d ${POSTGRES_DB:-rescuehive_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rescuehive-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-rescuehive}:${POSTGRES_PASSWORD:-rescuehive_secure_pass}@db:5432/${POSTGRES_DB:-rescuehive_db}
      - JWT_SECRET=${JWT_SECRET:-dev-insecure-secret-key-32chars-min!}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rescuehive-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
